name: Corpus statistics and literary wiki source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'originals/**'
      - 'readable/**'
      - 'tools/analyze_archive.py'
      - 'tools/unique_texts.py'
      - 'tools/build_library.py'
      - '.github/workflows/corpus-statistics.yml'
permissions:
  contents: write
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile canonical source texts
        run: python3 tools/unique_texts.py
      - name: Analyze unique source texts
        run: python3 tools/analyze_archive.py
      - name: Build canonical dashboard dataset
        run: python3 tools/build_library.py
      - name: Commit generated statistics and wiki source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md analytics wiki docs/data
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh corpus statistics and wiki source"
            git push
          fi

      - name: Mirror generated pages to the native GitHub Wiki if initialized
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          WIKI_REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git ls-remote "$WIKI_REMOTE" HEAD >/dev/null 2>&1; then
            echo "::notice::Native Wiki has not yet been initialized. Create a Home page in the Wiki tab to enable mirroring."
            exit 0
          fi
          git clone --quiet --depth 1 "$WIKI_REMOTE" /tmp/texts-wiki
          cp wiki/*.md /tmp/texts-wiki/
          python3 - <<'PY'
          import re
          from pathlib import Path
          for p in Path("/tmp/texts-wiki").glob("*.md"):
              src=p.read_text(encoding="utf-8")
              dst=re.sub(r"\]\(((?:Home|Verkindex|Genre-och-form|Teman-och-motiv|Amnen-och-fokus|Figurer|Semantik|Redaktionell-analys|Korpus-och-metod)\.md)\)",lambda m: "]("+m.group(1)[:-3]+")",src)
              if dst!=src:p.write_text(dst,encoding="utf-8")
          PY
          cd /tmp/texts-wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          if ! git diff --cached --quiet; then
            git commit -m "Sync literary atlas from corpus statistics"
            git push
          fi
